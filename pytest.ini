# pytest.ini
[pytest]
DJANGO_SETTINGS_MODULE = rentsecure_be.settings
python_files = tests.py test_*.py *_tests.py
addopts = --strict-markers --strict-config --tb=short --durations=10
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
testpaths = .

# E2E tests override: set DJANGO_SETTINGS_MODULE=rentsecure_be.test_settings
# Example:
#   pytest tests/test_e2e_flows/ -v --tb=short
#   pytest tests/test_security_e2e/ -v --tb=short
markers =
    e2e: End-to-end integration / security flow tests
    security: Security regression tests (IDOR, payment, webhook)
    slow: Slow tests that may take >5 seconds
